name: Bug Report
description: Something in XLang doesn't behave the way the documentation says it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/adilson889/Xlang/issues) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect instead?
      placeholder: The `<foreach>` tag skips the last item of the array when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        A small, complete `.html` snippet that shows the problem — interpreter
        import + the smallest XLang code that reproduces it. Issues without a
        reproduction are hard to act on and may be closed.
      render: html
      placeholder: |
        <script src="https://cdn.jsdelivr.net/gh/adilson889/Xlang@main/xlang-interpreter.js"></script>
        <div data-xlang>
            <array name="frutas" value="['a', 'b', 'c']"></array>
            <foreach var="f" in="frutas">
                <print>{f}</print>
            </foreach>
        </div>
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: XLang version
      description: The version badge in the README, or the commit/date if you're on `main`.
      placeholder: 0.1.2
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other (mention in description)
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any error message printed to the browser console, if applicable.
      render: text
